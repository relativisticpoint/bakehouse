name: image-factory

on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/image.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly rebuild: patching = rebuilding the image

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
