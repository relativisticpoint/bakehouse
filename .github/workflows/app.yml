name: app

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]   # not a required check, so a path filter is fine here
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write   # needed for AWS OIDC and for keyless cosign signing
      contents: read
    steps:
